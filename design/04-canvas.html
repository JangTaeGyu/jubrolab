<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 4 — 작업 캔버스 / Workspace Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --bg:#F4F5F7;
  --dot:#CBD0D9;
  --card:#FFFFFF;
  --line:#DDE1E8;
  --ink:#141922;
  --ink-2:#5B6472;
  --game:#E4572E;
  --tool:#2563EB;
  --core:#111827;
  --disp:"Space Grotesk",Pretendard,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --body:Pretendard,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
::selection{background:#141922;color:#fff}

/* ── 캔버스 ─────────────────────────── */
#stage{
  position:fixed;inset:0;cursor:grab;
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);
  background-size:26px 26px;
}
#stage.drag{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

.node{
  position:absolute;width:246px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:16px 16px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  box-shadow:0 1px 2px rgba(20,25,34,.05),0 8px 24px -14px rgba(20,25,34,.35);
  transition:box-shadow .16s,border-color .16s,transform .16s;
}
.node:hover{transform:translateY(-2px);border-color:#AFB7C4;
  box-shadow:0 2px 4px rgba(20,25,34,.06),0 18px 40px -18px rgba(20,25,34,.45)}
.node.on{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,25,34,.1),0 18px 40px -18px rgba(20,25,34,.45)}
.node .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;color:#fff}
.chip.game{background:var(--game)}.chip.tool{background:var(--tool)}
.node h3{font-family:var(--disp);font-weight:600;font-size:16.5px;margin:0;letter-spacing:-.01em;line-height:1.25}
.node p{margin:8px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55}
.node .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;
  padding-top:10px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.node .lamp{display:inline-flex;align-items:center;gap:5px}
.node .lamp i{width:6px;height:6px;border-radius:50%;background:#16A34A}
.node .lamp.off i{background:#D97706}
.node .thumb{height:64px;border-radius:6px;overflow:hidden;margin-bottom:12px;background:#F0F2F5}
.node .thumb svg{width:100%;height:100%;display:block}

.hub{
  position:absolute;width:210px;background:var(--core);color:#fff;border-radius:12px;padding:20px;
  box-shadow:0 24px 50px -22px rgba(0,0,0,.6);
}
.hub h1{font-family:var(--disp);font-weight:700;font-size:27px;margin:0;letter-spacing:-.02em}
.hub h1 span{color:#8DA2FB}
.hub p{margin:9px 0 0;font-size:12.5px;color:#9AA3B2;line-height:1.6}
.hub .n{display:flex;gap:14px;margin-top:14px;font-family:var(--mono);font-size:11px;color:#6B7280}
.hub .n b{display:block;color:#fff;font-size:19px;font-weight:500;font-family:var(--disp)}

/* ── HUD ───────────────────────────── */
.hud{position:fixed;z-index:10;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.hud-tl{top:20px;left:20px;display:flex;align-items:center;gap:14px}
.hud-tl .mark{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:-.01em}
.legend{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hud-tr{top:20px;right:20px;display:flex;gap:8px}
.btn{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:7px;
  width:32px;height:32px;font-size:15px;color:var(--ink);cursor:pointer;line-height:1;font-family:var(--mono)}
.btn:hover{background:#fff;border-color:#AFB7C4}
.btn.w{width:auto;padding:0 12px;font-size:11.5px;letter-spacing:.06em}
.hud-bl{bottom:20px;left:20px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;padding:8px 13px;letter-spacing:.03em}
.hud-bl kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink);background:#fff}

/* ── 상세 패널 ──────────────────────── */
.panel{
  position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:#fff;
  border-left:1px solid var(--line);z-index:20;padding:30px 30px 40px;overflow-y:auto;
  transform:translateX(102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);
  box-shadow:-30px 0 60px -30px rgba(20,25,34,.4);
}
.panel.open{transform:none}
.panel .x{position:absolute;top:20px;right:22px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink-2);line-height:1}
.panel .hero{height:150px;border-radius:9px;overflow:hidden;background:#F0F2F5;margin-bottom:20px}
.panel .hero svg{width:100%;height:100%;display:block}
.panel h2{font-family:var(--disp);font-weight:700;font-size:27px;margin:0 0 4px;letter-spacing:-.02em}
.panel .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 16px}
.panel .body{font-size:14.5px;line-height:1.75;color:#333B47;margin:0}
.panel dl{display:grid;grid-template-columns:96px 1fr;gap:0;margin:24px 0 0;font-size:13px}
.panel dt{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:9px 0;border-top:1px solid var(--line);letter-spacing:.04em}
.panel dd{margin:0;padding:9px 0;border-top:1px solid var(--line);color:var(--ink)}
.panel .go{display:block;text-align:center;margin-top:24px;background:var(--ink);color:#fff;
  text-decoration:none;border-radius:8px;padding:13px;font-family:var(--disp);font-weight:600;font-size:14px}
.panel .go.off{background:#F0F2F5;color:var(--ink-2);cursor:default}

@media(max-width:720px){.hud-bl{display:none}.panel{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>

<div id="stage">
  <div id="world">
    <svg id="edges"></svg>
    <div class="hub" id="hub">
      <h1>jubro<span>lab</span></h1>
      <p>혼자 만든 것들을 한 판에 펼쳐뒀습니다. 끌어서 옮기고, 굴려서 확대하고, 눌러서 열어보세요.</p>
      <div class="n">
        <span>게임<b>4</b></span><span>도구<b>4</b></span><span>운영 중<b>6</b></span>
      </div>
    </div>
  </div>
</div>

<div class="hud hud-tl">
  <span class="mark">jubrolab.dev</span>
  <span class="legend"><span><i style="background:#E4572E"></i>게임</span><span><i style="background:#2563EB"></i>도구</span></span>
</div>
<div class="hud hud-tr">
  <button class="btn" id="zo" aria-label="축소">−</button>
  <button class="btn" id="zi" aria-label="확대">+</button>
  <button class="btn w" id="rc">전체 보기</button>
</div>
<div class="hud hud-bl">드래그로 이동 · 휠로 확대 · <kbd>0</kbd> 원위치</div>

<aside class="panel" id="panel" aria-hidden="true">
  <button class="x" id="px" aria-label="닫기">×</button>
  <div id="pc"></div>
</aside>

<script>
const ART={
 ink:`<rect width="100" height="40" fill="#FDF0EC"/><path d="M0 40 Q18 8 44 22 T78 12 T100 26 L100 40Z" fill="#E4572E" opacity=".8"/><path d="M0 40 Q26 30 52 34 T100 32 L100 40Z" fill="#141922" opacity=".18"/>`,

 specast:`<rect width="100" height="40" fill="#EEF3FF"/><rect x="5" y="5" width="16" height="30" fill="#fff" stroke="#C3D2F5"/><rect x="25" y="5" width="44" height="17" fill="#2563EB" opacity=".25" stroke="#2563EB"/><rect x="25" y="26" width="44" height="9" fill="#fff" stroke="#C3D2F5"/><rect x="73" y="5" width="22" height="30" fill="none" stroke="#2563EB" stroke-dasharray="3 2"/>`,
 paperdoll:`<rect width="100" height="40" fill="#F6F3FA"/><g fill="none" stroke="#D3CBE3"><rect x="6" y="6" width="14" height="28"/><rect x="24" y="6" width="14" height="28"/><rect x="42" y="6" width="14" height="28"/><rect x="60" y="6" width="14" height="28"/><rect x="78" y="6" width="14" height="28"/></g><rect x="24" y="6" width="14" height="28" fill="#2563EB" opacity=".3"/><rect x="60" y="6" width="14" height="28" fill="#E4572E" opacity=".3"/>`,
 t2v:`<rect width="100" height="40" fill="#F2F6F5"/><g fill="none" stroke="#2563EB" opacity=".55"><path d="M0 30 C18 8 34 34 50 18 S80 4 100 24"/><path d="M0 35 C18 13 34 39 50 23 S80 9 100 29"/></g><circle cx="68" cy="16" r="6" fill="#E4572E" opacity=".55"/>`,

};
const N=[
 {id:"specast",x:-620,y:-300,cat:"tool",name:"Specast",tag:"스펙 기반 UI 빌더",live:0,url:"https://specast.jubrolab.dev/",
  short:"JSON 스펙 하나를 진실로 삼는 화면 빌더.",
  body:"드래그로 화면을 짜고, 자연어로 시키고, Figma에서 가져오고, React 코드나 HTML5 임베드로 내보냅니다. 카탈로그는 어떤 프레임워크에도 기대지 않아서 렌더 타깃을 갈아 끼울 수 있습니다.",
  meta:[["유형","도구 · UI 빌더"],["컴포넌트","51종"],["프런트","React 19 · Vite"],["백엔드","NestJS · Prisma · Supabase"],["구조","모노레포 9패키지"]]},
 {id:"paperdoll",x:-620,y:20,cat:"tool",name:"Paperdoll",tag:"캐릭터 스프라이트 메이커",live:1,url:"https://paperdoll.jubrolab.dev/",
  short:"파츠를 겹쳐 만들고 스프라이트 시트로 받는다.",
  body:"레이어 파츠를 조립해 캐릭터를 만들고, 레이어마다 색을 곱연산으로 입히고, 애니메이션을 확인한 뒤 상태별 스프라이트 시트를 zip 하나로 내려받습니다. 원본 1,512장(135MB)을 아틀라스 36장(3.2MB)으로 굽습니다.",
  meta:[["유형","도구 · 에셋"],["레이어","13개 · 파츠 36종"],["프레임","파츠당 42장"],["스택","Next.js · sharp · fflate"],["라이선스","CC0 아트워크"]]},
 {id:"t2v",x:-620,y:330,cat:"tool",name:"Text2Visual",tag:"텍스트 → 생성 아트",live:1,url:"https://text2visual.jubrolab.dev/",
  short:"같은 문장은 언제나 같은 그림이 된다.",
  body:"입력한 텍스트를 결정론적으로 그림으로 바꿉니다. 화풍은 유체·붓터치·마블링·수채·점묘·모자이크·글리치 등 8가지. 같은 문장이 항상 같은 패턴을 만드니 SHA-256으로 진위를 검증할 수 있고, 그 성질을 그대로 써서 그림으로 하는 2차 인증도 붙였습니다.",

 {id:"token",x:-300,y:330,cat:"tool",name:"Token Generator",tag:"보안 토큰 생성기",live:1,url:"https://token-generator.jubrolab.dev/",
  short:"토큰 15종을 한 화면에서.",
  body:"UUID v1·v4·v7, Hex, Base64, API Key, JWT 스타일 Bearer, OTP까지 15종을 카테고리로 걸러 만들고 한 번에 복사합니다. 오프라인에서도 열리도록 PWA로 감쌌습니다.",
  meta:[["유형","도구 · 유틸리티"],["토큰","15종"],["단축키","Enter · Ctrl+C"],["스택","Next.js 14 · CSS Modules"],["오프라인","PWA"]]},
 {id:"vc",x:300,y:-300,cat:"game",name:"Chronicles of the Vanguard",tag:"2D 실시간 전략 + 에디터",live:1,url:"https://vc-rts.jubrolab.dev/",
  short:"A* · FSM AI · 시야 안개 · 봇까지.",
  body:"경로탐색은 A*, 유닛 AI는 FSM, 시야는 셀 단위 안개, 자원은 채집과 고갈까지 굴러갑니다. 맵과 유닛을 직접 만드는 에디터가 따로 붙어 두 앱이 같은 데이터를 봅니다.",
  meta:[["유형","게임 · RTS"],["엔진","Phaser 3 · Next.js"],["유닛","24종"],["앱","게임 + 에디터"],["QA","Playwright 시나리오 11종"]]},
 {id:"ink",x:300,y:20,cat:"game",name:"INK ARENA",tag:"영역 점령 잉크 슈터",live:1,url:"https://ink-arena.jubrolab.dev/",
  short:"더 넓게 칠한 팀이 이긴다.",
  body:"바닥을 잉크로 칠해 더 많은 영역을 차지한 팀이 이깁니다. 폰에서 열면 트윈스틱이 자동으로 붙고 발사 버튼은 없습니다 — 엄지가 둘뿐이라 이동·조준·발사·잠수를 버튼 넷으로 나누면 조작이 성립하지 않기 때문입니다.",
  meta:[["유형","게임 · 액션"],["엔진","Phaser 4"],["빌드","Vite · TypeScript"],["조작","키보드 · 트윈스틱"],["오프라인","PWA"]]},
 {id:"story",x:300,y:330,cat:"game",name:"Story Hacker",tag:"PIN 해독 추리 퍼즐",live:1,url:"https://story-hacker.jubrolab.dev/",
  short:"단서를 읽고 비밀번호를 맞힌다.",
  body:"스토리 모드는 이야기 속 단서를 읽고 PIN을 추리하고, 추론 모드는 이야기 없이 숫자의 위치·크기·관계만으로 풉니다. 틀리면 벌 대신 새 단서가 열립니다.",
  meta:[["유형","게임 · 퍼즐"],["에피소드","스토리 10 · 추론 8"],["평가","별점 3단계"],["스택","Next.js · React"]]},
 {id:"kiply",x:620,y:20,cat:"game",name:"Kiply",tag:"어린이 교육 미니게임",live:0,url:"https://kiply.jubrolab.dev/",

  body:"풍선을 터뜨려 덧셈, 카드를 뒤집어 기억력, 흩어진 글자로 어휘력, 두더지를 잡아 암산. 프로필을 나눠 쓰고 난이도를 고르고 학습 리포트를 남깁니다. 아이들이 쓰는 것이라 접근성은 WCAG를 지켰습니다.",
  meta:[["유형","게임 · 학습"],["게임","7종"],["난이도","3단계"],["스택","Next.js 14 · Zustand"],["접근성","WCAG 준수"]]},
];

const world=document.getElementById('world'),stage=document.getElementById('stage'),
      edges=document.getElementById('edges'),hub=document.getElementById('hub'),
      panel=document.getElementById('panel'),pc=document.getElementById('pc');

N.forEach(n=>{
  const el=document.createElement('button');
  el.className='node';el.style.left=n.x+'px';el.style.top=n.y+'px';el.dataset.id=n.id;
  el.innerHTML=`
    <div class="thumb"><svg viewBox="0 0 100 40" preserveAspectRatio="none">${ART[n.id]}</svg></div>
    <div class="top"><span class="chip ${n.cat}">${n.cat==='game'?'게임':'도구'}</span></div>
    <h3>${n.name}</h3><p>${n.short}</p>
    <div class="foot"><span>${n.tag}</span>
      <span class="lamp ${n.live?'':'off'}"><i></i>${n.live?'운영 중':'준비 중'}</span></div>`;
  el.addEventListener('click',()=>open(n,el));
  world.appendChild(el);
});

// 허브 중앙 배치 + 간선
hub.style.left='-105px';hub.style.top='30px';
function drawEdges(){
  const hx=0,hy=90;
  edges.setAttribute('viewBox','-900 -500 1800 1000');
  edges.style.left='0px';edges.style.top='0px';
  edges.setAttribute('width','1800');edges.setAttribute('height','1000');
  edges.style.transform='translate(-900px,-500px)';
  edges.innerHTML=N.map(n=>{
    const tx=n.x+(n.x<0?246:0),ty=n.y+90;
    const c=(hx+tx)/2;
    return `<path d="M${hx} ${hy} C${c} ${hy} ${c} ${ty} ${tx} ${ty}"
      fill="none" stroke="${n.cat==='game'?'#E4572E':'#2563EB'}" stroke-width="1.4" opacity=".28"/>
      <circle cx="${tx}" cy="${ty}" r="3" fill="${n.cat==='game'?'#E4572E':'#2563EB'}" opacity=".5"/>`;
  }).join('');
}
drawEdges();

// 팬 / 줌
let s=.82,tx=0,ty=0,dragging=false,sx,sy;
function apply(){
  const w=innerWidth/2,h=innerHeight/2;
  world.style.transform=`translate(${w+tx}px,${h+ty}px) scale(${s})`;
}
const BOX={x:-620,y:-300,w:1486,h:900,cx:123,cy:150};
function fit(){
  s=Math.min(.95,(innerWidth-90)/BOX.w,(innerHeight-130)/BOX.h);
  s=Math.max(.3,s);
  tx=-BOX.cx*s;ty=-BOX.cy*s;apply();
}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node'))return;
  dragging=true;sx=e.clientX-tx;sy=e.clientY-ty;stage.classList.add('drag');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{if(!dragging)return;tx=e.clientX-sx;ty=e.clientY-sy;apply()});
stage.addEventListener('pointerup',()=>{dragging=false;stage.classList.remove('drag')});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const k=Math.exp(-e.deltaY*.0016),ns=Math.min(1.7,Math.max(.32,s*k));
  const w=innerWidth/2,h=innerHeight/2,mx=e.clientX-w-tx,my=e.clientY-h-ty;
  tx-=mx*(ns/s-1);ty-=my*(ns/s-1);s=ns;apply();
},{passive:false});
document.getElementById('zi').onclick=()=>{s=Math.min(1.7,s*1.22);apply()};
document.getElementById('zo').onclick=()=>{s=Math.max(.32,s/1.22);apply()};
document.getElementById('rc').onclick=fit;
addEventListener('keydown',e=>{if(e.key==='0')fit();if(e.key==='Escape')close()});
addEventListener('resize',apply);
fit();

// 패널
function open(n,el){
  document.querySelectorAll('.node').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  pc.innerHTML=`
    <div class="hero"><svg viewBox="0 0 100 40" preserveAspectRatio="none">${ART[n.id]}</svg></div>
    <h2>${n.name}</h2><p class="sub">${n.tag}</p>
    <p class="body">${n.body}</p>
    <dl>${n.meta.map(m=>`<dt>${m[0]}</dt><dd>${m[1]}</dd>`).join('')}</dl>
    ${n.live?`<a class="go" href="${n.url}">${n.url.replace('https://','').replace(/\/$/,'')} 열기</a>`
             :`<span class="go off">아직 배포 전입니다</span>`}`;
  panel.classList.add('open');panel.setAttribute('aria-hidden','false');
}
function close(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');
  document.querySelectorAll('.node').forEach(x=>x.classList.remove('on'))}
document.getElementById('px').onclick=close;
</script>
