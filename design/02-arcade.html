<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 2 — 셀렉트 화면 / Arcade Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --void:#120A20;
  --panel:#1D0F33;
  --panel-2:#2A1749;
  --edge:#4B2C7A;
  --hot:#FF2D78;
  --cyan:#2AE7F0;
  --gold:#FFC93C;
  --lime:#8CF06B;
  --text:#EDE4FF;
  --dim:#9C86C4;
  --disp:"Chakra Petch",Pretendard,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,monospace;
  --body:Pretendard,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--void);color:var(--text);font-family:var(--body);
  min-height:100vh;overflow-x:hidden;
}
body::before{ /* 주사선 */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
body::after{ /* 비네트 */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:98;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(6,2,14,.75) 100%);
}
::selection{background:var(--hot);color:#fff}

.frame{max-width:1360px;margin:0 auto;padding:22px 26px 60px;min-height:100vh;display:flex;flex-direction:column}
.select{flex:1}

/* ── 상단 바 ─────────────────────────── */
.bar{
  display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;
  border-bottom:2px solid var(--edge);padding-bottom:12px;
}
.logo{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.16em;color:var(--text)}
.logo i{color:var(--hot);font-style:normal}
.credits{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.12em}
.credits b{color:var(--gold);font-weight:400}

/* ── 타이틀 ──────────────────────────── */
.title-row{padding:34px 0 26px;text-align:center}
.title-row h1{
  font-family:var(--disp);font-weight:700;margin:0;
  font-size:clamp(34px,7vw,82px);letter-spacing:.04em;line-height:1;
  color:#fff;
  text-shadow:3px 0 0 var(--hot),-3px 0 0 var(--cyan);
  animation:jitter 6s steps(1) infinite;
}
@keyframes jitter{0%,92%{text-shadow:3px 0 0 var(--hot),-3px 0 0 var(--cyan)}
  94%{text-shadow:7px 0 0 var(--hot),-6px 2px 0 var(--cyan)}
  96%{text-shadow:-2px 1px 0 var(--hot),4px -1px 0 var(--cyan)}}
.title-row p{margin:14px auto 0;max-width:52ch;color:var(--dim);font-size:15px}

/* ── 셀렉트 레이아웃 ─────────────────── */
.select{display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:26px;align-items:start}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cell{
  position:relative;aspect-ratio:3/4;border:2px solid var(--edge);background:var(--panel);
  cursor:pointer;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;
  transition:transform .12s,border-color .12s,background .12s;
  color:inherit;text-align:left;font:inherit;
}
.cell .art{position:absolute;inset:0;opacity:.5;transition:opacity .2s}
.cell .scrim{ /* 이름이 그림 위에서도 읽히도록 */
  position:absolute;left:0;right:0;bottom:0;height:60%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(9,4,18,.94));
}
.cell .cat{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);
  position:relative;margin-bottom:4px;
}
.cell .nm{
  font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.15;
  position:relative;letter-spacing:.01em;
}
.cell .blurb{
  position:relative;font-size:11.5px;line-height:1.5;color:var(--dim);margin-top:6px;
  max-height:0;opacity:0;overflow:hidden;transition:max-height .25s,opacity .25s;
}
.cell:hover .blurb,.cell[aria-selected="true"] .blurb{max-height:60px;opacity:1}
.cell:hover,.cell[aria-selected="true"]{
  border-color:var(--hot);background:var(--panel-2);transform:translateY(-3px);
}
.cell:hover .art,.cell[aria-selected="true"] .art{opacity:1}
.cell[aria-selected="true"]::before,.cell[aria-selected="true"]::after{
  content:"";position:absolute;width:14px;height:14px;border:2px solid var(--cyan);
  animation:pulse 1s ease-in-out infinite alternate;
}
.cell[aria-selected="true"]::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.cell[aria-selected="true"]::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
@keyframes pulse{to{opacity:.25}}
.cell .lock{
  position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;color:var(--gold);border:1px solid var(--gold);padding:1px 5px;
}

/* ── 미리보기 패널 ───────────────────── */
.preview{
  border:2px solid var(--edge);background:linear-gradient(180deg,var(--panel-2),var(--panel));
  padding:22px;position:sticky;top:22px;
}
.preview .screen{
  aspect-ratio:16/10;border:1px solid var(--edge);background:#0C0518;position:relative;overflow:hidden;
}
.preview .screen svg{position:absolute;inset:0;width:100%;height:100%}
.preview .cat2{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin:18px 0 6px}
.preview h2{font-family:var(--disp);font-weight:700;font-size:30px;margin:0;letter-spacing:.01em;line-height:1.1}
.preview .blurb{color:var(--dim);font-size:14.5px;margin:12px 0 0;min-height:66px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:18px 0 0;border-top:1px solid var(--edge)}
.specs div{border-bottom:1px solid var(--edge);padding:9px 0;font-family:var(--mono);font-size:12px;color:var(--dim)}
.specs div:nth-child(odd){padding-right:12px}
.specs b{display:block;color:var(--text);font-weight:400;font-size:13px;margin-top:2px;letter-spacing:.04em}
.play{
  display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;
  border:2px solid var(--hot);background:var(--hot);color:#12061A;
  font-family:var(--disp);font-weight:700;letter-spacing:.14em;font-size:14px;
  padding:14px;text-decoration:none;transition:filter .15s;
}
.play:hover{filter:brightness(1.15)}
.play.off{background:transparent;color:var(--gold);border-color:var(--gold);cursor:default}
.hint{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-align:center;margin-top:12px}
.hint kbd{border:1px solid var(--edge);padding:1px 5px;color:var(--text)}

@media(max-width:1080px){
  .select{grid-template-columns:1fr}
  .preview{position:static}
  .grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:620px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .frame{padding:16px 14px 48px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>
<div class="frame">

  <div class="bar">
    <div class="logo">JUBRO<i>·</i>LAB</div>
    <div class="credits">SIDE PROJECTS <b>08</b> · LIVE <b>06</b> · BUILDING <b>02</b></div>
  </div>

  <div class="title-row">
    <h1>SELECT A PROJECT</h1>
    <p>혼자 만든 게임 넷과 도구 넷. 하나 고르면 오른쪽에서 무엇인지 보여줍니다.</p>
  </div>

  <div class="select">
    <div class="grid" id="grid" role="listbox" aria-label="프로젝트 선택"></div>
    <div class="preview" id="preview"></div>
  </div>
</div>

<script>
const P=[
 {id:"ink",cat:"ACTION",name:"INK ARENA",live:1,url:"https://ink-arena.jubrolab.dev/",
  blurb:"바닥을 잉크로 칠해 더 넓게 차지한 팀이 이긴다. 폰에서 열면 트윈스틱이 붙고, 발사 버튼은 없다 — 엄지가 둘뿐이니까.",
  specs:[["엔진","Phaser 4"],["빌드","Vite · TS"],["플랫폼","웹 · PWA"],["조작","키보드 · 터치"]],
  art:`<rect width="100" height="100" fill="#0C0518"/><path d="M0 100 Q22 30 50 58 T100 40 L100 100Z" fill="#FF2D78" opacity=".85"/><path d="M0 100 Q30 74 60 84 T100 78 L100 100Z" fill="#2AE7F0" opacity=".7"/><circle cx="63" cy="44" r="4" fill="#FFC93C"/>`},
 {id:"vc",cat:"STRATEGY",name:"Chronicles of the Vanguard",live:1,url:"https://vc-rts.jubrolab.dev/",
  blurb:"A* 경로탐색, FSM 유닛 AI, 시야 안개, 자원 채집, 상대할 봇. 맵과 유닛을 직접 만드는 에디터가 따로 붙는다.",
  specs:[["엔진","Phaser 3"],["셸","Next.js"],["유닛","24종"],["앱","게임 + 에디터"]],
  art:`<rect width="100" height="100" fill="#0C0518"/><g stroke="#4B2C7A" fill="none"><path d="M0 25h100M0 50h100M0 75h100M25 0v100M50 0v100M75 0v100"/></g><circle cx="28" cy="38" r="6" fill="#2AE7F0"/><circle cx="72" cy="66" r="6" fill="#FF2D78"/><path d="M28 38 72 66" stroke="#FFC93C" stroke-dasharray="3 3"/>`},
 {id:"story",cat:"PUZZLE",name:"Story Hacker",live:1,url:"https://story-hacker.jubrolab.dev/",
  blurb:"이야기 속 단서를 읽고 비밀번호를 맞힌다. 스토리로 푸는 10편, 이야기 없이 논리만으로 푸는 8편.",
  specs:[["장르","추리 · 논리"],["에피소드","18편"],["스택","Next.js"],["모드","스토리 · 추론"]],
  art:`<rect width="100" height="100" fill="#0C0518"/><g font-family="Share Tech Mono" font-size="26" fill="#2AE7F0"><text x="10" y="62">7</text><text x="34" y="62" fill="#4B2C7A">?</text><text x="58" y="62">3</text><text x="80" y="62" fill="#4B2C7A">?</text></g><rect x="30" y="34" width="20" height="34" fill="#FF2D78" opacity=".3"/>`},
 {id:"kiply",cat:"KIDS",name:"Kiply",live:0,url:"https://kiply.jubrolab.dev/",
  blurb:"6~12세를 위한 미니게임 7종. 풍선을 터뜨려 덧셈, 카드를 뒤집어 기억력, 두더지를 잡아 암산. 프로필을 나눠 쓰고 리포트를 남긴다.",
  specs:[["게임","7종"],["스택","Next.js 14"],["상태","Zustand"],["접근성","WCAG 준수"]],
  art:`<rect width="100" height="100" fill="#0C0518"/><circle cx="26" cy="40" r="15" fill="#FFC93C" opacity=".9"/><circle cx="62" cy="32" r="10" fill="#FF2D78" opacity=".8"/><circle cx="72" cy="66" r="18" fill="#8CF06B" opacity=".55"/><circle cx="34" cy="76" r="8" fill="#2AE7F0" opacity=".8"/>`},
 {id:"specast",cat:"TOOL",name:"Specast",live:0,url:"https://specast.jubrolab.dev/",
  blurb:"JSON 스펙 하나를 진실로 삼는 화면 빌더. 드래그로 짜고, 말로 시키고, Figma에서 가져오고, React나 HTML5로 내보낸다.",
  specs:[["컴포넌트","51종"],["프런트","React 19"],["백엔드","NestJS · Prisma"],["구조","모노레포 9패키지"]],
  art:`<rect width="100" height="100" fill="#0C0518"/><rect x="6" y="10" width="20" height="80" fill="#2A1749" stroke="#4B2C7A"/><rect x="32" y="10" width="42" height="46" fill="#FF2D78" opacity=".35" stroke="#FF2D78"/><rect x="32" y="62" width="42" height="28" stroke="#4B2C7A" fill="none"/><rect x="80" y="10" width="14" height="80" stroke="#2AE7F0" fill="none" stroke-dasharray="3 3"/>`},
 {id:"paperdoll",cat:"TOOL",name:"Paperdoll",live:1,url:"https://paperdoll.jubrolab.dev/",
  blurb:"레이어 파츠를 겹쳐 캐릭터를 만들고, 레이어마다 색을 입히고, 상태별 스프라이트 시트를 zip 하나로 받는다.",
  specs:[["레이어","13개"],["파츠","36종"],["프레임","42장"],["번들","135MB → 3.2MB"]],
  art:`<rect width="100" height="100" fill="#0C0518"/><g fill="none" stroke="#4B2C7A"><rect x="8" y="12" width="16" height="76"/><rect x="28" y="12" width="16" height="76"/><rect x="48" y="12" width="16" height="76"/><rect x="68" y="12" width="16" height="76"/></g><rect x="28" y="12" width="16" height="76" fill="#2AE7F0" opacity=".45"/><rect x="68" y="12" width="16" height="76" fill="#FF2D78" opacity=".45"/>`},
 {id:"t2v",cat:"TOOL",name:"Text2Visual",live:1,url:"https://text2visual.jubrolab.dev/",
  blurb:"같은 문장은 언제나 같은 그림이 된다. 화풍 8가지, SHA-256으로 진위를 확인하는 인증서, 그림으로 하는 2차 인증.",
  specs:[["화풍","8종"],["방식","결정론적 해시"],["검증","SHA-256"],["스택","Next.js · canvas"]],
  art:`<rect width="100" height="100" fill="#0C0518"/><g fill="none" stroke="#2AE7F0" opacity=".8"><path d="M0 70 C20 28 38 76 54 44 S84 18 100 52"/><path d="M0 80 C20 38 38 86 54 54 S84 28 100 62"/></g><g fill="none" stroke="#FF2D78" opacity=".8"><path d="M0 60 C20 18 38 66 54 34 S84 8 100 42"/></g><circle cx="72" cy="34" r="9" fill="#FFC93C" opacity=".85"/>`},
 {id:"token",cat:"TOOL",name:"Token Generator",live:1,url:"https://token-generator.jubrolab.dev/",
  blurb:"UUID v1·v4·v7, Hex, Base64, API Key, JWT 스타일 Bearer, OTP까지 15종을 한 화면에서 만들고 한 번에 복사한다.",
  specs:[["토큰","15종"],["스택","Next.js 14"],["스타일","CSS Modules"],["오프라인","PWA"]],
  art:`<rect width="100" height="100" fill="#0C0518"/><g fill="#4B2C7A"><rect x="10" y="26" width="80" height="6"/><rect x="10" y="40" width="58" height="6"/><rect x="10" y="54" width="72" height="6"/><rect x="10" y="68" width="40" height="6"/></g><rect x="10" y="40" width="24" height="6" fill="#8CF06B"/><rect x="10" y="54" width="34" height="6" fill="#FF2D78"/>`},
];

const grid=document.getElementById('grid');
const prev=document.getElementById('preview');
let cur=0;

grid.innerHTML=P.map((p,i)=>`
  <button class="cell" role="option" aria-selected="${i===0}" data-i="${i}">
    <svg class="art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${p.art}</svg>
    <span class="scrim"></span>
    ${p.live?'':'<span class="lock">WIP</span>'}
    <span class="cat">${p.cat}</span>
    <span class="nm">${p.name}</span>
    <span class="blurb">${p.specs[0][0]} ${p.specs[0][1]}</span>
  </button>`).join('');

function render(i){
  const p=P[i];
  prev.innerHTML=`
    <div class="screen"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${p.art}</svg></div>
    <p class="cat2">${p.cat}</p>
    <h2>${p.name}</h2>
    <p class="blurb">${p.blurb}</p>
    <div class="specs">${p.specs.map(s=>`<div>${s[0]}<b>${s[1]}</b></div>`).join('')}</div>
    ${p.live
      ? `<a class="play" href="${p.url}">▶ 열어보기</a>`
      : `<span class="play off">⚙ 만드는 중</span>`}
    <p class="hint"><kbd>←</kbd> <kbd>→</kbd> 로 이동 · <kbd>Enter</kbd> 로 열기</p>`;
  [...grid.children].forEach((c,j)=>c.setAttribute('aria-selected',j===i));
  cur=i;
}
grid.addEventListener('click',e=>{const b=e.target.closest('.cell');if(b)render(+b.dataset.i)});
grid.addEventListener('mouseover',e=>{const b=e.target.closest('.cell');if(b)render(+b.dataset.i)});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){render((cur+1)%P.length);grid.children[cur].focus()}
  if(e.key==='ArrowLeft'){render((cur-1+P.length)%P.length);grid.children[cur].focus()}
  if(e.key==='Enter'&&P[cur].live&&document.activeElement.closest('.cell'))location.href=P[cur].url;
});
render(0);
</script>
</body>
</html>
