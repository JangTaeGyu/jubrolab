<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 1 — 창 (Window Manager)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#fbfaf7; --card:#fff; --grid:#e6e3d8; --grid2:#d3cebc;
  --line:#e2dfd5; --line-soft:#eeece4;
  --ink:#15150f; --muted:#67655c; --faint:#9a978c;
  --disp:"Archivo",Pretendard,sans-serif; --mono:"IBM Plex Mono",monospace; --body:Pretendard,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--body);color:var(--ink);overflow:hidden;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,160px 160px,160px 160px;
}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.menubar{
  position:fixed;top:0;left:0;right:0;height:34px;z-index:900;
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--faint);
}
.menubar b{font-family:var(--disp);font-weight:800;font-size:13.5px;letter-spacing:-.01em;color:var(--ink)}

.hint{
  position:fixed;top:60px;left:0;right:0;text-align:center;pointer-events:none;z-index:1;
}
.hint h1{font-family:var(--disp);font-weight:800;font-size:clamp(24px,3.6vw,40px);letter-spacing:-.04em;margin:0;line-height:1.14}
.hint p{margin:10px 0 0;color:var(--muted);font-size:13.5px}
.hint span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint)}

/* ── 창 ────────────────────────────────── */
.win{
  position:fixed;background:var(--card);border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 30px 60px -28px rgba(21,21,15,.5);
  display:flex;flex-direction:column;min-width:280px;min-height:200px;
  animation:pop .26s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.win.on{box-shadow:0 0 0 1px var(--ink),0 40px 70px -30px rgba(21,21,15,.55)}
.bar{
  height:38px;flex:0 0 38px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-bottom:1px solid var(--line-soft);cursor:grab;user-select:none;background:#fcfbf9;
}
.bar.grabbing{cursor:grabbing}
.lights{display:flex;gap:6px}
.lights i{width:11px;height:11px;border-radius:50%;display:block;cursor:pointer;border:0;padding:0}
.lights .c{background:#ff5f57}.lights .m{background:#febc2e}.lights .z{background:#28c840;opacity:.35;cursor:default}
.bar h2{font-family:var(--disp);font-weight:700;font-size:12.5px;margin:0;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint);margin-left:auto}

.body{flex:1;overflow:auto;min-height:0}
.shot{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;background:var(--grid)}
.meta{padding:16px 18px 18px}
.meta .tag{font-size:13px;color:var(--muted);margin:0 0 10px}
.meta .txt{font-size:13px;line-height:1.8;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:0;list-style:none}
.chips li{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--muted);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:var(--ink);color:var(--paper);
  text-decoration:none;border-radius:99px;padding:9px 18px;font-family:var(--disp);font-weight:600;font-size:12px}
.go.off{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.grip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.grip::after{content:"";position:absolute;right:4px;bottom:4px;width:7px;height:7px;
  border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);opacity:.6}

/* ── 독 ────────────────────────────────── */
.dock{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:800;
  display:flex;align-items:flex-end;gap:2px;padding:9px 10px;border-radius:20px;
  background:rgba(255,255,255,.76);backdrop-filter:blur(18px);
  border:1px solid var(--line);box-shadow:0 18px 40px -22px rgba(21,21,15,.45);
}
.slot{display:flex;justify-content:center;transition:width .14s ease-out}
.dot{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative}
.dot img{display:block;border-radius:24%;box-shadow:0 8px 16px -8px rgba(21,21,15,.55);
  transition:width .14s ease-out,height .14s ease-out}
.dot .live{width:4px;height:4px;border-radius:50%;background:var(--ink);margin-top:5px;opacity:0}
.dot.open .live{opacity:1}
.tip{
  position:absolute;bottom:calc(100% + 12px);white-space:nowrap;background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:4px 9px;border-radius:7px;
  opacity:0;transition:opacity .12s;pointer-events:none;
}
.dot:hover .tip{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="menubar"><b>jubro·lab</b><span id="clock">--:--</span></div>

<div class="hint">
  <h1>아이디어를 현실로 만드는<br>1인 개발 연구실</h1>
  <p>독에서 아무거나 눌러보세요. 창은 끌어서 옮기고, 오른쪽 아래를 잡아 크기를 바꿉니다.</p>
  <p><span>여러 개를 동시에 열어 나란히 놓고 비교할 수 있습니다</span></p>
</div>

<div class="dock" id="dock"></div>

<script src="_projects.js"></script>
<script>
const dock = document.getElementById('dock');
const ICON_SIZE = 52, GAP = 8, MAG = .55, FALL = 1.2;
let hovered = null, zTop = 10;
const windows = new Map();

/* ── 독 ───────────────────────────────── */
dock.innerHTML = PROJECTS.map((p,i)=>`
  <div class="slot" data-slot="${i}" style="width:${ICON_SIZE+GAP}px">
    <button class="dot" data-i="${i}" aria-label="${p.name} 열기">
      <span class="tip">${p.name}</span>
      <img src="${ICON(p.id)}" alt="" width="${ICON_SIZE}" height="${ICON_SIZE}">
      <span class="live"></span>
    </button>
  </div>`).join('');

function magnify(){
  PROJECTS.forEach((_,i)=>{
    const s = hovered===null ? 1 : 1 + MAG*Math.exp(-Math.pow((i-hovered)/FALL,2));
    const px = ICON_SIZE*s;
    dock.querySelector(`[data-slot="${i}"]`).style.width = (px+GAP)+'px';
    const img = dock.querySelector(`[data-i="${i}"] img`);
    img.style.width = px+'px'; img.style.height = px+'px';
  });
}
dock.addEventListener('pointerover', e=>{
  const b = e.target.closest('.dot'); if(!b) return;
  hovered = +b.dataset.i; magnify();
});
dock.addEventListener('pointerleave', ()=>{ hovered=null; magnify(); });
dock.addEventListener('click', e=>{
  const b = e.target.closest('.dot'); if(!b) return;
  toggle(PROJECTS[+b.dataset.i]);
});

/* ── 창 ───────────────────────────────── */
function toggle(p){
  const w = windows.get(p.id);
  if(w){ if(w.dataset.on==='1'){ close(p.id); return; } raise(w); return; }
  openWin(p);
}

function openWin(p){
  const n = windows.size;
  const W = Math.min(430, innerWidth-40), H = Math.min(500, innerHeight-140);
  const el = document.createElement('section');
  el.className = 'win';
  el.style.width = W+'px'; el.style.height = H+'px';
  // 새 창은 계단식으로 조금씩 밀어 놓아 서로 완전히 가리지 않는다.
  el.style.left = Math.max(12, Math.min(innerWidth-W-12, 60 + (n%6)*38)) + 'px';
  el.style.top  = Math.max(44, Math.min(innerHeight-H-90, 66 + (n%6)*30)) + 'px';
  el.dataset.on = '1';
  el.innerHTML = `
    <header class="bar">
      <span class="lights">
        <button class="c" data-act="close" aria-label="닫기"></button>
        <button class="m" data-act="min" aria-label="최소화"></button>
        <i class="z"></i>
      </span>
      <h2>${p.name}</h2>
      <span class="k">${p.kind}</span>
    </header>
    <div class="body">
      <img class="shot" src="${OG(p.id)}" alt="">
      <div class="meta">
        <p class="tag">${p.tagline}</p>
        <p class="txt">${p.blurb}</p>
        <ul class="chips">${p.specs.map(s=>`<li>${s[0]} · ${s[1]}</li>`).join('')}</ul>
        ${p.status==='live'
          ? `<a class="go" href="${p.url}" target="_blank" rel="noreferrer">열어보기 ↗</a>`
          : `<span class="go off">${BADGE[p.status]}</span>`}
      </div>
    </div>
    <span class="grip"></span>`;
  document.body.appendChild(el);
  windows.set(p.id, el);
  el.dataset.id = p.id;
  raise(el);
  wire(el);
  mark();
}

function raise(el){ el.style.zIndex = ++zTop; el.dataset.on='1'; el.style.display='flex';
  document.querySelectorAll('.win').forEach(w=>w.classList.toggle('on', w===el)); }

function close(id){ const el = windows.get(id); if(!el) return; el.remove(); windows.delete(id); mark(); }
function mark(){
  PROJECTS.forEach((p,i)=>dock.querySelector(`[data-i="${i}"]`).classList.toggle('open', windows.has(p.id)));
}

function wire(el){
  el.addEventListener('pointerdown', ()=>raise(el));

  el.querySelector('.lights').addEventListener('click', e=>{
    const act = e.target.dataset.act;
    if(act==='close') close(el.dataset.id);
    if(act==='min'){ el.style.display='none'; el.dataset.on='0'; }
  });

  // 제목 표시줄을 잡아 옮긴다
  const bar = el.querySelector('.bar');
  bar.addEventListener('pointerdown', e=>{
    if(e.target.closest('.lights')) return;
    const r = el.getBoundingClientRect(), ox = e.clientX-r.left, oy = e.clientY-r.top;
    bar.classList.add('grabbing'); bar.setPointerCapture(e.pointerId);
    const move = ev=>{
      el.style.left = Math.max(0, Math.min(innerWidth-r.width, ev.clientX-ox))+'px';
      el.style.top  = Math.max(34, Math.min(innerHeight-46, ev.clientY-oy))+'px';
    };
    const up = ()=>{ bar.classList.remove('grabbing');
      bar.removeEventListener('pointermove',move); bar.removeEventListener('pointerup',up); };
    bar.addEventListener('pointermove',move); bar.addEventListener('pointerup',up);
  });

  // 오른쪽 아래 손잡이로 크기 조절
  const grip = el.querySelector('.grip');
  grip.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    const r = el.getBoundingClientRect(), sx=e.clientX, sy=e.clientY;
    grip.setPointerCapture(e.pointerId);
    const move = ev=>{
      el.style.width  = Math.max(280, r.width  + ev.clientX-sx)+'px';
      el.style.height = Math.max(200, r.height + ev.clientY-sy)+'px';
    };
    const up = ()=>{ grip.removeEventListener('pointermove',move); grip.removeEventListener('pointerup',up); };
    grip.addEventListener('pointermove',move); grip.addEventListener('pointerup',up);
  });
}

/* 첫인상용으로 두 개를 미리 띄워 "겹쳐 놓을 수 있다"를 보여준다 */
openWin(PROJECTS[8]);
openWin(PROJECTS[3]);

const tick = ()=>document.getElementById('clock').textContent =
  new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit'}).format(new Date());
tick(); setInterval(tick, 20000);
</script>
</body>
</html>
